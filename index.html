<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corazón de Partículas Animado</title>
    <style>
        /* Eliminamos márgenes para que el lienzo ocupe toda la pantalla */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a0010; /* Color de fondo oscuro de tu imagen */
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script src="script.js"></script>
</body>
</html>
